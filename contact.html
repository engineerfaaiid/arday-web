<!DOCTYPE html>

<head>

    <title>Arday | Contact</title>
    <style>

        .info { font-size: 1.1rem; color: var(--primary); margin-bottom: 20px; word-wrap: break-word; }

        .btn-msg { display: inline-block; background: var(--primary); color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: bold; font-family: sans-serif; margin-top: 20px; width: 85%; }
