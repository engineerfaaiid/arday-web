<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arday | Research Hub</title>
    <style>
        :root { --deep-black: #1a2a3a; --gold: #d4af37; --bg: #f8f9fa; }
        body { font-family: 'Georgia', serif; line-height: 1.6; color: #333; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); margin-top: 20px; position: relative; overflow: hidden; }
        
        /* The Pulsing Live Status */
        .status-bar { display: flex; align-items: center; justify-content: center; font-family: sans-serif; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 20px; }
        .pulse { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 0 rgba(46, 204, 113, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        h1 { font-size: 2.2rem; margin: 10px 0; color: var(--deep-blue); font-weight: normal; }
        #greeting { font-style: italic; color: #666; margin-bottom: 30px; display: block; }

        .card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 15px; margin-bottom: 20px; transition: transform 0.3s ease; }
        .card:active { transform: scale(0.98); background: #fafafa; }
        
        .hardware-box { border: 1.5px solid var(--gold); background: #fffdf5; }
        .label { font-family: sans-serif; font-size: 0.7rem; font-weight: bold; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .spec-title { font-size: 1.2rem; color: var(--deep-blue); font-weight: bold; font-family: sans-serif; }

        .btn-main { background: #000; color: #fff; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-family: sans-serif; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        footer { margin-top: 40px; font-family: sans-serif; font-size: 0.7rem; color: #ccc; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <div class="pulse"></div> System Online and functioning
    </div>

    <h1 id="time-greet">arday.so</h1>
    <span id="greeting">Soo dhawaaw...</span>

    <div class="card hardware-box">
        <span class="label">Primary Goal</span>
        <div class="spec-title">Snapdragon X2 Elite</div>
        <p style="margin: 5px 0; font-size: 0.9rem;">32GB LPDDR5x | 1TB NVMe SSD</p>
    </div>

    <div class="card">
        <span class="label" style="color: var(--deep-red);">Research</span>
        <p style="margin: 0; font-size: 0.95rem;">Focusing on <strong>Computational Physics</strong> and Somali scientific literacy.</p>
    </div>

    <a href="research.html" style="text-decoration: none;">
    <button class="btn-main">TO KNOW MORE, CLICK HERE</button>
</a>

</div>

<footer>&copy; 2026 | BUILT ON ASUS ZENBOOK A14</footer>

<script>
    // Dynamic Somali Greeting based on South Africa time
    const hour = new Date().getHours();
    const greetElement = document.getElementById('greeting');
    
    if (hour < 12) greetElement.innerText = "Subax wanaagsan — Morning update active.";
    else if (hour < 18) greetElement.innerText = "Galab waacan oo wanaagsan — Afternoon research in progress.";
    else greetElement.innerText = "Habeen wacan oo wanaagsan — Evening review phase.";
</script>

</body>
</html>
