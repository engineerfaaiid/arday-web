<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arday | Research Lab</title>
    <style>
        :root { --deep-blue: #1a2a3a; --accent: #2ecc71; --bg: #f8f9fa; }
        body { font-family: 'Georgia', serif; line-height: 1.6; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .nav-back { width: 100%; max-width: 450px; margin-bottom: 10px; }
        .nav-back a { text-decoration: none; color: var(--deep-blue); font-weight: bold; font-family: sans-serif; font-size: 0.9rem; }

        .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        h1 { font-size: 1.8rem; color: var(--deep-blue); margin-top: 0; }
        .lab-tag { background: var(--deep-blue); color: white; padding: 4px 10px; border-radius: 5px; font-family: sans-serif; font-size: 0.7rem; letter-spacing: 1px; }

        .app-box { margin-top: 30px; padding: 20px; background: #fffdf5; border: 1px solid #eee; border-radius: 15px; }
        h3 { margin-top: 0; font-family: sans-serif; font-size: 1rem; color: #555; }

        input { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 1rem; }
        .result-text { font-weight: bold; color: var(--accent); font-family: sans-serif; margin-top: 10px; display: block; }

        .btn-calc { background: var(--deep-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-back">
    <a href="index.html">← Back to Home</a>
</div>

<div class="container">
    <span class="lab-tag">PHYSICS APP v1.0</span>
    <h1>Research Lab</h1>
    <p style="font-size: 0.9rem; color: #666;">This tool helps convert scientific measurements for research documentation.</p>

    <div class="app-box">
        <h3>Distance Converter (m to km)</h3>
        <input type="number" id="metersInput" placeholder="Enter Meters (m)...">
        <button class="btn-calc" onclick="convertMeters()">Calculate</button>
        <span id="distanceResult" class="result-text"></span>
    </div>

    <div class="app-box" style="margin-top: 20px;">
        <h3>Notes / Research Log</h3>
        <textarea id="log" style="width: 100%; border-radius: 8px; border: 1px solid #ddd; padding: 10px;" rows="4" placeholder="Write Somali scientific notes here..."></textarea>
    </div>
</div>

<script>
    function convertMeters() {
        const meters = document.getElementById('metersInput').value;
        const km = meters / 1000;
        if (meters) {
            document.getElementById('distanceResult').innerText = meters + "m = " + km + "km";
        } else {
            document.getElementById('distanceResult').innerText = "Please enter a value.";
        }
    }
</script>

</body>
</html>
